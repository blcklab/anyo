name: Track F Anyo production validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  json-architecture:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run test:track-f
      - run: npm run benchmark:track-f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anyo-track-f-${{ matrix.os }}-node-${{ matrix.node }}
          path: track-f-benchmark-results.json
          if-no-files-found: ignore
