<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anyo Portfolio World</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f1115; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .panel { position: fixed; left: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); padding: 14px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(13,15,20,.78); backdrop-filter: blur(16px); color: white; }
      .panel h1 { margin: 0 0 5px; font-size: 16px; }
      .panel p { margin: 0; color: #bec1ca; font-size: 14px; line-height: 1.45; }
      .crosshair { position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,.8); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@blcklab/sekai64": "/node_modules/@blcklab/sekai64/dist/index.js",
          "@blcklab/sekai64/gltf": "/node_modules/@blcklab/sekai64/dist/gltf/index.js",
          "@blcklab/sekai64/interaction": "/node_modules/@blcklab/sekai64/dist/interaction/index.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="world" aria-label="Explorable Anyo portfolio"></canvas>
    <div class="crosshair" aria-hidden="true"></div>
    <section class="panel">
      <h1>Portfolio World</h1>
      <p id="message">Walk through the rooms and select a project display.</p>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
