<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anyo Virtual Store</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111318; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .hud { position: fixed; inset: 16px auto auto 16px; max-width: min(360px, calc(100vw - 32px)); padding: 14px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(14,16,21,.78); backdrop-filter: blur(16px); color: #f4f4f5; }
      .hud strong { display: block; margin-bottom: 5px; }
      .hud p { margin: 0; color: #b8bbc3; font-size: 14px; line-height: 1.45; }
      .hud button { margin-top: 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; padding: 8px 11px; background: #f4f4f5; color: #18181b; font: inherit; cursor: pointer; }
      .crosshair { position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; transform: translate(-50%,-50%); border-radius: 50%; background: rgba(255,255,255,.8); pointer-events: none; }
      .status { margin-top: 9px !important; color: #e7e7ea !important; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@blcklab/sekai64": "/node_modules/@blcklab/sekai64/dist/index.js",
          "@blcklab/sekai64/gltf": "/node_modules/@blcklab/sekai64/dist/gltf/index.js",
          "@blcklab/sekai64/interaction": "/node_modules/@blcklab/sekai64/dist/interaction/index.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="world" aria-label="Explorable Anyo virtual store"></canvas>
    <div class="crosshair" aria-hidden="true"></div>
    <aside class="hud">
      <strong>Anyo Virtual Store</strong>
      <p>WASD to move, mouse to look, Shift to run. On touch screens, drag the left side to move and the right side to look.</p>
      <button id="sale" type="button">Simulate one sale</button>
      <p class="status" id="status">Select a display inside the store.</p>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
